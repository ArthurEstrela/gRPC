syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.ifgoiano.grpc.lib";
option java_outer_classname = "WeatherProto";

package weather;

service WeatherService {
    // 1. Obter temperatura atual por cidade
    rpc GetCurrentTemperature(CityRequest) returns (TemperatureResponse);

    // 2. Obter previsão dos próximos 5 dias para uma cidade
    rpc GetFiveDayForecast(CityRequest) returns (ForecastResponse);

    // 3. Listar cidades disponíveis no sistema
    rpc ListCities(Empty) returns (CityListResponse);

    // 4. Cadastrar uma nova cidade com temperatura simulada
    rpc RegisterCity(RegisterCityRequest) returns (CityResponse);

    // 5. Obter estatísticas climáticas
    rpc GetClimateStats(CityRequest) returns (StatsResponse);
}

message Empty {}

message CityRequest {
    string name = 1;
}

message TemperatureResponse {
    string city_name = 1;
    double temperature = 2;
    string unit = 3;
}

message ForecastResponse {
    string city_name = 1;
    repeated ForecastDay days = 2;
}

message ForecastDay {
    string date = 1;
    double min_temp = 2;
    double max_temp = 3;
    string condition = 4;
}

message CityListResponse {
    repeated string cities = 1;
}

message RegisterCityRequest {
    string name = 1;
    double current_temperature = 2;
}

message CityResponse {
    string message = 1;
    bool success = 2;
}

message StatsResponse {
    string city_name = 1;
    double average_temperature = 2;
    double min_temperature = 3;
    double max_temperature = 4;
}
